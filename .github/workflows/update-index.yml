name: 自动更新脚本索引

on:
  push:
    branches: [main, dev]
    paths:
      - '_BsKeyTools/Scripts/BsScriptHub/**'

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整历史，用于读取文件提交日期
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: 生成索引
        run: python _BsKeyTools/Scripts/BsScriptHub/generate_index.py
      
      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _BsKeyTools/Scripts/BsScriptHub/scripts_index.json
          if git diff --staged --quiet; then
            echo "scripts_index.json 已是最新"
            exit 0
          fi
          # main 受规则集保护（必须走 PR），bot 无法直接推送；索引只在 dev 自动提交，随 dev 合入 main
          if [ "$GITHUB_REF_NAME" != "dev" ]; then
            git diff --staged --stat
            echo "::warning::$GITHUB_REF_NAME 上的 scripts_index.json 不是最新，请在 dev 运行 generate_index.py 或推送 dev 让本工作流自动更新后再合入"
            exit 0
          fi
          git commit -m "chore: 自动更新脚本索引"
          git push
