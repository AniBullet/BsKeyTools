name: Sync to Gitee

# 镜像拉取的唯一入口：
# - 每次 push main 都会运行 "Build and Release"（无新版本时 check-version 后即跳过），
#   它结束后再触发本工作流（此时新版本的 tag / Release 已创建）。
#   这样每次 push 只拉一次，避免 Gitee 5 分钟内重复拉取被拒。
# - workflow_dispatch 用于手动补同步，始终以 GitHub main 当前 HEAD 为目标。
# 同步确认后 gitee-release 把 GitHub Release（正文 + 两个 exe）补到 Gitee：
# 已存在且附件齐全则跳过；镜像不同步 Release，插件优先从 Gitee 下载安装包。
on:
  workflow_run:
    workflows: ["Build and Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "要补发到 Gitee 的 Release tag（留空 = GitHub 最新 Release）"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: sync-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITEE_REPO: acebullet/BsKeyTools
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_REF: ${{ github.ref }}
      UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      POLL_INTERVAL: 30
      POLL_TIMEOUT: 600

    steps:
      - name: Trigger Gitee mirror pull and verify
        run: |
          set -euo pipefail

          if [ -z "${GITEE_TOKEN}" ]; then
            echo "::error::GITEE_TOKEN secret is empty"
            exit 1
          fi

          echo "Event: ${EVENT_NAME} (ref ${EVENT_REF})"
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            echo "Build and Release conclusion: ${UPSTREAM_CONCLUSION}"
          fi
          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${EVENT_REF}" != "refs/heads/main" ]; then
            echo "::warning::Dispatched from ${EVENT_REF}; mirror target is still GitHub main HEAD"
          fi

          github_main_sha() {
            curl -fsS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GH_REPO}/branches/main" | jq -er '.commit.sha'
          }

          gitee_main_sha() {
            curl -fsS \
              "https://gitee.com/api/v5/repos/${GITEE_REPO}/branches/main?access_token=${GITEE_TOKEN}" \
              | jq -er '.commit.sha'
          }

          EXPECTED=$(github_main_sha) || {
            echo "::error::Failed to read GitHub main HEAD"
            exit 1
          }
          BEFORE=$(gitee_main_sha) || BEFORE=""
          echo "GitHub main: ${EXPECTED}"
          echo "Gitee  main: ${BEFORE:-<unknown>}"

          if [ "${BEFORE}" = "${EXPECTED}" ]; then
            echo "Gitee is already at ${EXPECTED}; skip triggering pull"
            exit 0
          fi

          BODY_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "${BODY_FILE}" -w "%{http_code}" -X POST \
            "https://gitee.com/api/v5/repos/${GITEE_REPO}/remote_mirror/pull?access_token=${GITEE_TOKEN}") || HTTP_CODE="000"
          echo "Gitee mirror pull: HTTP ${HTTP_CODE}"
          cat "${BODY_FILE}"; echo
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "::error::Gitee mirror pull request failed (HTTP ${HTTP_CODE})"
            exit 1
          fi

          DEADLINE=$((SECONDS + POLL_TIMEOUT))
          CURRENT=""
          LATEST="${EXPECTED}"
          while [ "${SECONDS}" -lt "${DEADLINE}" ]; do
            sleep "${POLL_INTERVAL}"
            CURRENT=$(gitee_main_sha) || CURRENT=""
            LATEST=$(github_main_sha) || LATEST="${EXPECTED}"
            echo "[${SECONDS}s] Gitee main: ${CURRENT:-<unknown>} | expected: ${EXPECTED} | GitHub main now: ${LATEST}"
            if [ -n "${CURRENT}" ] && { [ "${CURRENT}" = "${EXPECTED}" ] || [ "${CURRENT}" = "${LATEST}" ]; }; then
              echo "Gitee mirror synced to ${CURRENT}"
              exit 0
            fi
          done

          echo "::error::Gitee mirror not synced after ${POLL_TIMEOUT}s. Gitee main=${CURRENT:-<unknown>}, expected=${EXPECTED} (GitHub main now=${LATEST}). Gitee 仓库镜像管理里的 GitHub 私人令牌可能失效，去 Gitee 仓库 → 管理 → 仓库镜像管理 更换令牌 / The GitHub token stored in Gitee mirror settings may be invalid: Gitee repo → Settings → Repository Mirror Management → update token."
          exit 1

  gitee-release:
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GITEE_REPO: acebullet/BsKeyTools
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      INPUT_TAG: ${{ github.event.inputs.tag }}

    steps:
      - name: Publish GitHub Release to Gitee
        run: |
          set -euo pipefail
          API="https://gitee.com/api/v5/repos/${GITEE_REPO}"

          TAG="${INPUT_TAG:-}"
          if [ -z "${TAG}" ]; then
            TAG=$(gh release view --json tagName -q .tagName)
          fi
          echo "Tag: ${TAG}"

          gh release view "${TAG}" --json name,body,assets > gh-release.json
          NAME=$(jq -r .name gh-release.json)

          # GitHub runner 到 Gitee 偶发 TLS 握手超时（v1.4.1 补发时遇到 curl 28），只读请求重试
          gitee_get() {
            curl -fsS --retry 4 --retry-all-errors --retry-delay 10 \
              --connect-timeout 30 --max-time 120 "$1"
          }

          RELEASE=$(gitee_get "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}") || {
            echo "::error::读取 Gitee Release ${TAG} 失败（网络或 API 错误，见上方 curl 输出）"
            exit 1
          }
          if [ "${RELEASE}" != "null" ] && [ -n "${RELEASE}" ] && \
             jq -e --argjson r "${RELEASE}" \
               '[.assets[].name | select(endswith(".exe"))] - [$r.assets[]?.name] | length == 0' \
               gh-release.json > /dev/null; then
            echo "Gitee Release ${TAG} already has all installers, nothing to do"
            exit 0
          fi

          # Gitee 的 tag 来自镜像同步；没有 tag 时创建 Release 会指到 Gitee 当前 main，结果不可信
          TAGS=$(gitee_get "${API}/tags?per_page=100&access_token=${GITEE_TOKEN}") || {
            echo "::error::读取 Gitee tag 列表失败（网络或 API 错误，见上方 curl 输出）"
            exit 1
          }
          echo "${TAGS}" | jq -e --arg t "${TAG}" 'any(.[]; .name == $t)' > /dev/null || {
            echo "::error::Gitee 上没有 tag ${TAG}，镜像可能未同步 tag"
            exit 1
          }

          mkdir -p dist
          gh release download "${TAG}" --pattern '*.exe' --dir dist
          ls -l dist

          if [ "${RELEASE}" = "null" ] || [ -z "${RELEASE}" ]; then
            jq -n --arg token "${GITEE_TOKEN}" --arg tag "${TAG}" --arg name "${NAME}" \
                  --slurpfile gh gh-release.json \
              '{access_token: $token, tag_name: $tag, name: $name, body: $gh[0].body, target_commitish: "main"}' \
              > payload.json
            # 写请求失败后先回读：请求可能已在 Gitee 生效，只是响应丢了，避免重复创建
            CREATED=""
            for attempt in 1 2 3 4 5; do
              if RESP=$(curl -sS --connect-timeout 30 --max-time 120 -X POST "${API}/releases" \
                   -H "Content-Type: application/json" --data-binary @payload.json); then
                if echo "${RESP}" | jq -e '.id' > /dev/null 2>&1; then
                  RELEASE="${RESP}"; CREATED=1; break
                fi
                echo "::error::Gitee Release 创建失败: ${RESP}"
                exit 1
              fi
              echo "Create attempt ${attempt} failed (network), re-checking Gitee..."
              sleep 10
              RELEASE=$(gitee_get "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}") || RELEASE="null"
              if [ "${RELEASE}" != "null" ] && [ -n "${RELEASE}" ]; then CREATED=1; break; fi
            done
            [ -n "${CREATED}" ] || { echo "::error::创建 Gitee Release ${TAG} 连续 5 次网络失败"; exit 1; }
            echo "Created Gitee Release ${TAG}"
          else
            echo "Gitee Release ${TAG} already exists"
          fi
          RELEASE_ID=$(echo "${RELEASE}" | jq -r '.id')

          for f in dist/*.exe; do
            n=$(basename "$f")
            if echo "${RELEASE}" | jq -e --arg n "$n" 'any(.assets[]?; .name == $n)' > /dev/null; then
              echo "$n already attached, skip"
              continue
            fi
            DONE=""
            for attempt in 1 2 3; do
              echo "Uploading $n ($(du -h "$f" | cut -f1)), attempt ${attempt}..."
              if RESP=$(curl -sS --connect-timeout 30 --max-time 3000 -w "\n%{http_code}" -X POST \
                   "${API}/releases/${RELEASE_ID}/attach_files" \
                   -F "access_token=${GITEE_TOKEN}" -F "file=@$f"); then
                CODE=$(echo "${RESP}" | tail -n 1)
                if [ "${CODE}" = "201" ]; then DONE=1; break; fi
                echo "::error::$n 上传失败 (HTTP ${CODE}): $(echo "${RESP}" | head -n -1)"
                exit 1
              fi
              echo "Upload attempt ${attempt} failed (network), re-checking Gitee..."
              sleep 10
              CUR=$(gitee_get "${API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}") || CUR="null"
              if echo "${CUR}" | jq -e --arg n "$n" 'any(.assets[]?; .name == $n)' > /dev/null 2>&1; then
                DONE=1; break
              fi
            done
            [ -n "${DONE}" ] || {
              echo "::error::$n 上传连续 3 次网络失败；重跑 Sync to Gitee（-f tag=${TAG}）会只补缺的附件"
              exit 1
            }
            echo "$n uploaded"
          done
          echo "Gitee Release ${TAG}: https://gitee.com/${GITEE_REPO}/releases/tag/${TAG}"
